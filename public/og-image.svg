<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="50%" stop-color="#12161f"/>
      <stop offset="100%" stop-color="#181d27"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/>
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Card Border Container -->
  <rect x="60" y="50" width="1080" height="530" rx="24" fill="#12161f" fill-opacity="0.7" stroke="#334155" stroke-width="1.5"/>

  <!-- Logo Badge -->
  <g transform="translate(110, 105)">
    <rect width="64" height="64" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Rocket Icon -->
    <path d="M42 20c-5.5 0-11 2.5-14.5 6.5l-6 6.5 7.5 7.5 6.5-6c4-3.5 6.5-9 6.5-14.5z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M21.5 33L17 40l7 2.5 2-4" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M37 25a3 3 0 100 6 3 3 0 000-6z" fill="#38bdf8"/>
    <path d="M19 45c-2 2-3 5-3 5s3-1 5-3c1-1 1-2 0-2s-1 0-2 0z" fill="#38bdf8"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(195, 120)">
    <rect width="320" height="34" rx="8" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="16" y="22" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">
      VENTURE STRATEGY WORKSPACE
    </text>
  </g>

  <!-- Main Headline -->
  <text x="110" y="245" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">
