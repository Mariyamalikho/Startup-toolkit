  </text>

  <!-- Subheadline -->
  <text x="110" y="305" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#cbd5e1" letter-spacing="-0.3">
    Structured Lean Frameworks for Early-Stage Venture Validation
  </text>

  <!-- Feature Pill Tags -->
  <g transform="translate(110, 360)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="170" height="40" rx="10" fill="#181d27" stroke="#334155" stroke-width="1"/>
    <text x="18" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
      Ideation &amp; Empathy
    </text>

    <!-- Pill 2 -->
    <rect x="185" y="0" width="190" height="40" rx="10" fill="#181d27" stroke="#334155" stroke-width="1"/>
    <text x="18" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" transform="translate(185, 0)">
      9-Box Business Model
    </text>

    <!-- Pill 3 -->
    <rect x="390" y="0" width="180" height="40" rx="10" fill="#181d27" stroke="#334155" stroke-width="1"/>
    <text x="18" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" transform="translate(390, 0)">
      Validation Sprints
    </text>

    <!-- Pill 4 -->
    <rect x="585" y="0" width="180" height="40" rx="10" fill="#181d27" stroke="#334155" stroke-width="1"/>
    <text x="18" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" transform="translate(585, 0)">
      Investor Pitch Deck
    </text>

    <!-- Pill 5 -->
    <rect x="780" y="0" width="170" height="40" rx="10" fill="#181d27" stroke="#334155" stroke-width="1"/>
    <text x="18" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" transform="translate(780, 0)">
      Executive PDF Export
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="110" y1="455" x2="1090" y2="455" stroke="#334155" stroke-width="1"/>

  <!-- Footer Info -->
  <g transform="translate(110, 495)">
    <text x="0" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">
      Built with precision by <tspan fill="#38bdf8">Mariyam Ali K.</tspan>
    </text>
    <text x="980" y="20" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#94a3b8">
      startup-toolkit-three.vercel.app
    </text>
  </g>
